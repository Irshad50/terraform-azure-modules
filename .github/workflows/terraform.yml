name: Terraform Azure DevSecOps CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

# Prevent multiple Terraform operations from running
# against the same state at the same time.
concurrency:
  group: terraform-azure-production
  cancel-in-progress: false


# ============================================================
# STAGE 1: DevSecOps Security & Compliance Scanning
# ============================================================

jobs:

  security_scan:
    name: "Stage 1: Security & Quality Scan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: azure_landing_zone/dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init - Validation Mode
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: azure_landing_zone/dev
          framework: terraform
          soft_fail: true

      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-dir: azure_landing_zone/dev
          exit-code: "0"


  # ============================================================
  # STAGE 2: Manual Approval + Fresh Plan + Apply
  # ============================================================

  terraform_deploy:
    name: "Stage 2: Approval + Fresh Plan + Apply"

    needs: security_scan

    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main')
      ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    # Configure "production" environment in GitHub
    # with required reviewers for manual approval.
    environment:
      name: production

    defaults:
      run:
        working-directory: azure_landing_zone/dev

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # --------------------------------------------------------
      # Azure Authentication
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # --------------------------------------------------------
      # Terraform Initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # --------------------------------------------------------
      # Fresh Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: |
          rm -f tfplan
          terraform plan -out=tfplan

      # --------------------------------------------------------
      # Apply EXACT SAME PLAN
      # --------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan